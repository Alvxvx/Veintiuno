<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<title>Nuestras emociones</title>
<style>
:root{--bg:#0b0b0b;--card:#161616;--red:#e11d2e;--tx:#f5f5f5;--mu:#8a8a8a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent}
body{max-width:480px;margin:0 auto;padding:12px 14px 30px;touch-action:pan-y}
h1{font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);text-align:center;margin:6px 0 12px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.nav button{background:var(--card);border:1px solid #2a2a2a;color:var(--tx);width:40px;height:40px;border-radius:12px;font-size:20px}
.nav div{font-size:20px;font-weight:700;text-transform:capitalize}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dow{font-size:11px;color:var(--mu);text-align:center;padding:4px 0}
.day{aspect-ratio:1/1.1;background:var(--card);border:1px solid #242424;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 4px;font-size:11px;color:var(--mu);position:relative}
.day.today{border-color:var(--red);color:var(--tx)}
.day svg{width:78%;height:auto}
.day i{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.empty{visibility:hidden}
.legend{display:flex;justify-content:space-between;margin-top:14px;font-size:10px;color:var(--mu);text-align:center}
.legend svg{width:26px;display:block;margin:0 auto 2px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:flex-end;z-index:9}
.sheet.on{display:flex}
.panel{background:#121212;border-top:2px solid var(--red);border-radius:20px 20px 0 0;width:100%;max-width:480px;margin:0 auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:85%;overflow:auto}
.panel h2{margin:0 0 12px;font-size:16px;text-transform:capitalize}
.emos{display:flex;justify-content:space-between;margin-bottom:14px}
.emos button{background:none;border:2px solid transparent;border-radius:14px;padding:4px;color:var(--mu);font-size:10px;width:19%}
.emos button.sel{border-color:var(--red);color:var(--tx)}
.emos svg{width:100%;display:block}
.note{background:var(--card);border-left:3px solid var(--red);border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:14px;word-wrap:break-word}
.note small{display:block;color:var(--mu);font-size:11px;margin-bottom:2px}
.row{display:flex;gap:8px;margin-top:10px}
.row input{flex:1;background:var(--card);border:1px solid #2a2a2a;border-radius:10px;color:var(--tx);padding:11px;font-size:16px}
.row button,.close{background:var(--red);color:#fff;border:0;border-radius:10px;padding:0 16px;font-weight:600;font-size:15px}
.close{background:none;color:var(--mu);width:100%;padding:12px;margin-top:6px}
#st{text-align:center;color:var(--mu);font-size:11px;margin-top:10px}
</style></head><body>
<h1>♥ Nuestro registro ♥</h1>
<div class="nav"><button id="prev">‹</button><div id="title"></div><button id="next">›</button></div>
<div class="grid" id="grid"></div>
<div class="legend" id="legend"></div>
<div id="st">Desliza para cambiar de mes</div>
<div class="sheet" id="sheet"><div class="panel">
<h2 id="sh"></h2><div class="emos" id="emos"></div>
<div id="notes"></div>
<div class="row"><input id="txt" placeholder="Escribe un comentario…" maxlength="300"><button id="send">Enviar</button></div>
<button class="close" id="close">Cerrar</button></div></div>
<script>
/* ===== CONFIGURA AQUÍ ===== */
const FIREBASE_CONFIG={apiKey:"AIzaSyDpyJmbReOJ4sG_fT3PwaIh8J8P29zWW5E",authDomain:"veintiuno-ba859.firebaseapp.com",projectId:"veintiuno-ba859",storageBucket:"veintiuno-ba859.firebasestorage.app",messagingSenderId:"1087304259489",appId:"1:1087304259489:web:abc80649339bf65a089de0"};
const CODE="veintiuno-Rk7mQ2xP94tL"; // el mismo para los dos, difícil de adivinar
/* ========================== */
const E=[{k:"increible",n:"Increíble",c:"#22c55e",m:"M7 13q5 7 10 0z"},{k:"bien",n:"Bien",c:"#a3e635",m:"M7 13q5 4 10 0"},{k:"meh",n:"Meh",c:"#facc15",m:"M8 14h8"},{k:"mal",n:"Mal",c:"#fb923c",m:"M8 15q4-3 8 0"},{k:"horrible",n:"Horrible",c:"#ef4444",m:"M7 16q5-6 10 0"}];
const face=e=>`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="${e.c}"/><circle cx="8.5" cy="9" r="1.4" fill="#111"/><circle cx="15.5" cy="9" r="1.4" fill="#111"/><path d="${e.m}" stroke="#111" stroke-width="1.6" fill="${e.k=="increible"?"#111":"none"}" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const $=id=>document.getElementById(id);
let days={},db=null,me=null,view=new Date(),cur=null,unN=null,names={};
view.setDate(1);
const key=(y,m,d)=>y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
$("legend").innerHTML=E.map(e=>`<div>${face(e)}${e.n}</div>`).join("");
function render(){
  const y=view.getFullYear(),m=view.getMonth();
  $("title").textContent=view.toLocaleDateString("es",{month:"long",year:"numeric"});
  const first=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),t=new Date();
  let h=["L","M","M","J","V","S","D"].map(d=>`<div class="dow">${d}</div>`).join("");
  for(let i=0;i<first;i++)h+='<div class="day empty"></div>';
  for(let d=1;d<=n;d++){
    const k=key(y,m,d),r=days[k],e=r&&E.find(x=>x.k==r.emo);
    const today=t.getFullYear()==y&&t.getMonth()==m&&t.getDate()==d;
    h+=`<div class="day${today?" today":""}" data-k="${k}"><span>${d}</span>${e?face(e):"<span></span>"}${r&&r.nn?"<i></i>":""}</div>`;
  }
  $("grid").innerHTML=h;
}
const go=n=>{view.setMonth(view.getMonth()+n);render()};
$("prev").onclick=()=>go(-1);$("next").onclick=()=>go(1);
let sx=0,sy=0;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
document.addEventListener("touchend",e=>{if($("sheet").classList.contains("on"))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.5)go(dx<0?1:-1)},{passive:true});
$("grid").onclick=e=>{const d=e.target.closest(".day[data-k]");if(d)openDay(d.dataset.k)};
function openDay(k){
  cur=k;const [y,m,d]=k.split("-").map(Number);
  $("sh").textContent=new Date(y,m-1,d).toLocaleDateString("es",{weekday:"long",day:"numeric",month:"long"});
  $("notes").innerHTML="";paintEmos();$("sheet").classList.add("on");
  if(unN)unN();
  if(db)unN=db.collection("days/"+k+"/notes").onSnapshot(s=>paintNotes(s.docs.map(x=>x.data()).sort((a,b)=>a.t-b.t)),()=>{});
}
function paintEmos(){
  const r=days[cur];
  $("emos").innerHTML=E.map(e=>`<button data-k="${e.k}" class="${r&&r.emo==e.k?"sel":""}">${face(e)}${e.n}</button>`).join("");
}
$("emos").onclick=async e=>{
  const b=e.target.closest("button");if(!b||!db)return;
  const prev=days[cur]||{};
  days[cur]={...prev,emo:b.dataset.k};paintEmos();render();
  try{await db.doc("days/"+cur).set({emo:b.dataset.k,nn:prev.nn||0})}catch(x){$("st").textContent="No se pudo guardar"}
};
async function paintNotes(a){
  if(!a.length){$("notes").innerHTML='<div style="color:var(--mu);font-size:13px">Aún no hay comentarios.</div>';return}
  $("notes").innerHTML=a.map(x=>{const s=document.createElement("div");s.className="note";
    const sm=document.createElement("small");sm.textContent=(x.u==me?"Tú":x.u)+" · "+new Date(x.t).toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"});
    s.appendChild(sm);s.appendChild(document.createTextNode(x.x));return s.outerHTML}).join("");
}
$("send").onclick=async()=>{
  const v=$("txt").value.trim();if(!v||!db)return;$("txt").value="";
  const id=Date.now()+"_"+Math.random().toString(36).slice(2,6);
  try{
    await db.doc("days/"+cur+"/notes/"+id).set({x:v,u:me,t:Date.now()});
    const r=days[cur]||{};
    await db.doc("days/"+cur).set({emo:r.emo||"",nn:(r.nn||0)+1});
  }catch(x){$("st").textContent="No se pudo guardar"}
};
$("close").onclick=()=>{$("sheet").classList.remove("on");if(unN){unN();unN=null}};
render();
(function(){
  me=localStorage.getItem("quien");
  if(!me){me=(prompt("¿Cómo te llamas? (así te verá tu pareja)")||"Yo").trim().slice(0,20);localStorage.setItem("quien",me)}
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    const fs=firebase.firestore(),P=p=>"couples/"+CODE+"/"+p;
    db={doc:p=>({set:d=>fs.doc(P(p)).set(d)}),
        collection:p=>({onSnapshot:(n,e)=>fs.collection(P(p)).onSnapshot(s=>n({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()}))}),e)})};
    db.collection("days").onSnapshot(s=>{days={};s.docs.forEach(d=>days[d.id]=d.data());render();if(cur&&$("sheet").classList.contains("on"))paintEmos()},()=>{$("st").textContent="Error de conexión"});
  }catch(x){$("st").textContent="Falta configurar Firebase"}
})();
</script></body></html>
